<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipForge FFmpeg Check</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #14243a;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #0b2545;
      color: white;
      font-weight: 700;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>FFmpeg availability check</h1>
    <p>This checks whether FFmpeg is installed on the ClipForge server.</p>
    <form id="check-form">
      <label for="token">Diagnostic token</label>
      <input id="token" type="password" autocomplete="off"
        required minlength="32" placeholder="Paste your Render token here">
      <button type="submit">Check FFmpeg</button>
    </form>
    <pre id="result" role="status"></pre>
  </main>
  <script>
    const form = document.getElementById("check-form");
    const tokenInput = document.getElementById("token");
    const result = document.getElementById("result");form.addEventListener("submit", async function (event) {
  event.preventDefault();
  result.textContent = "Checking server...";
  const token = tokenInput.value;

  try {
    const response = await fetch("/api/diagnostics/ffmpeg", {
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      cache: "no-store"
    });
    const data = await response.json();
    result.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent = "Could not reach the server. Check deployment and try again.";
  } finally {
    tokenInput.value = "";
  }
});

  </script>
</body>
</html>
